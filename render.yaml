services:
  - type: web
    name: cybercheck
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /
    disk:
      name: cybercheck-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SQLITE_DB_PATH
        value: /opt/render/project/src/data/cybercheck.db
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
