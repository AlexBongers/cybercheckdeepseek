# Apache reverse proxy example for QNAP.
# The Cybercheck Docker container should publish port 3000 on the NAS host.
# Replace cybercheck.example.nl with your own hostname.
#
# Required Apache modules:
# - proxy
# - proxy_http
# - headers

<VirtualHost *:80>
    ServerName cybercheck.example.nl

    ProxyPreserveHost On
    ProxyRequests Off

    RequestHeader set X-Forwarded-Proto "http"
    ProxyPass / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    ErrorLog logs/cybercheck-error.log
    CustomLog logs/cybercheck-access.log combined
</VirtualHost>
